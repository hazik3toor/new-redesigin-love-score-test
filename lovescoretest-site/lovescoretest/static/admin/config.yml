# Decap CMS config. Site files live in the repo folder lovescoretest-site/lovescoretest/ (paths below include it).
backend:
  name: github
  repo: hazik3toor/new-redesigin-love-score-test
  branch: main
  base_url: https://lovescoretest.com
  auth_endpoint: api/auth

site_url: https://lovescoretest.com
display_url: https://lovescoretest.com
media_folder: lovescoretest-site/lovescoretest/static/images
public_folder: /images
locale: en

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: lovescoretest-site/lovescoretest/content/blog
    create: true
    extension: md
    slug: "{{fields.slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: "URL slug (lowercase-with-dashes, used in the link)", name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Only lowercase letters, numbers and dashes"], hint: "Example: zodiac-love-match -> /blog/zodiac-love-match" }
      - { label: "Short name for footer/menu (optional)", name: menu_title, widget: string, required: false, hint: "Example: Zodiac Calculator. If empty, the full title is used." }
      - { label: Title, name: title, widget: string }
      - { label: "Meta description (about 150 characters)", name: description, widget: string }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Last updated (optional), name: updated, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: Category, name: category, widget: relation, collection: categories, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
      - { label: Image, name: image, widget: image, required: false, hint: "Best size 1200x675 (WebP or JPG)" }
      - { label: Image alt text, name: image_alt, widget: string, required: false }
      - { label: Draft (hide from site), name: draft, widget: boolean, default: false, required: false }
      - { label: "Custom calculator / tool code (optional): paste HTML + CSS + JS here", name: tool, widget: text, required: false, hint: "Self-contained code only. It shows on the page together with your article." }
      - { label: "Where to show the custom code", name: tool_position, widget: select, options: [{ label: "Above the article", value: top }, { label: "Below the article", value: bottom }], default: top, required: false }
      - label: "FAQs (optional)"
        name: faqs
        widget: list
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages (tools, quizzes)
    label_singular: Page
    folder: lovescoretest-site/lovescoretest/content/tools
    create: true
    extension: md
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    fields:
      - { label: "URL slug (lowercase-with-dashes, used in the link)", name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Only lowercase letters, numbers and dashes"], hint: "Example: love-language-test -> /love-language-test" }
      - { label: "Short name for footer/menu (optional)", name: menu_title, widget: string, required: false, hint: "Example: Zodiac Calculator. If empty, the full title is used." }
      - { label: Title, name: title, widget: string }
      - { label: "Meta description (about 150 characters)", name: description, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Category, name: category, widget: relation, collection: categories, search_fields: [name], value_field: "{{slug}}", display_fields: [name] }
      - { label: Image, name: image, widget: image, required: false, hint: "Best size 1200x675 (WebP or JPG)" }
      - { label: Image alt text, name: image_alt, widget: string, required: false }
      - { label: Draft (hide from site), name: draft, widget: boolean, default: false, required: false }
      - { label: "Calculator on this page", name: calculator, widget: select, options: [{ label: "None", value: "none" }, { label: "Love calculator (two birth dates)", value: "love-birthdate" }], default: "none", required: false, hint: "The calculator appears under the title, then your text below it." }
      - { label: "Custom calculator / tool code (optional): paste HTML + CSS + JS here", name: tool, widget: text, required: false, hint: "Self-contained code only. It shows on the page together with your article." }
      - { label: "Where to show the custom code", name: tool_position, widget: select, options: [{ label: "Above the article", value: top }, { label: "Below the article", value: bottom }], default: top, required: false }
      - label: "FAQs (optional)"
        name: faqs
        widget: list
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Body, name: body, widget: markdown }

  - name: categories
    label: Categories
    label_singular: Category
    folder: lovescoretest-site/lovescoretest/content/categories
    create: true
    extension: md
    slug: "{{fields.name}}"
    summary: "{{icon}} {{name}}"
    fields:
      - { label: Name, name: name, widget: string, hint: "Menu and page name. You can change it any time (the link stays the same)." }
      - { label: "Icon (paste one emoji, example 💞)", name: icon, widget: string, default: "💕" }
      - { label: "Menu order (1, 2, 3...)", name: order, widget: number, value_type: int, min: 1, default: 9, required: false }
      - { label: "Short text for home card", name: blurb, widget: string, required: false, hint: "If empty, it is written automatically." }
      - { label: "SEO title", name: title, widget: string, required: false, hint: "If empty, it is written automatically." }
      - { label: "Meta description", name: description, widget: string, required: false, hint: "If empty, it is written automatically." }
      - { label: "Extra text (optional, shown under the list)", name: body, widget: markdown, required: false }

  - name: site
    label: Home & Site Pages
    files:
      - name: home
        label: Home page (calculator + article)
        file: lovescoretest-site/lovescoretest/content/home.md
        fields:
          - { label: Title (H1 and Google title), name: title, widget: string }
          - { label: Meta description, name: description, widget: string }
          - { label: Show calculator, name: calculator, widget: boolean, default: true }
          - { label: "Article (keep the first line as Heading 1)", name: body, widget: markdown, hint: "To add an image: click the image button in the toolbar, upload or pick a picture, then fill Alt text (and Title if you want)." }
      - name: about
        label: About
        file: lovescoretest-site/lovescoretest/content/pages/about.md
        fields: &legal
          - { label: Google title, name: title, widget: string }
          - { label: Page heading, name: h1, widget: string }
          - { label: Meta description, name: description, widget: string }
          - { label: Body, name: body, widget: markdown }
      - name: contact
        label: Contact
        file: lovescoretest-site/lovescoretest/content/pages/contact.md
        fields: *legal
      - name: privacy
        label: Privacy Policy
        file: lovescoretest-site/lovescoretest/content/pages/privacy-policy.md
        fields: *legal
      - name: terms
        label: Terms of Use
        file: lovescoretest-site/lovescoretest/content/pages/terms.md
        fields: *legal
